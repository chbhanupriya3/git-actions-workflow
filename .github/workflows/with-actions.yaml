name: With Actions
on:
  workflow_dispatch:
jobs:
    with-actions:
        runs-on: ubuntu-latest
        steps:
        -   name: Checkoput the repo
            uses: actions/checkout@v3

        -   name: Setup Java 21
            uses: actions/setup-java@v4
            with:
                distribution: 'temurin'        
                java-version: '25'
                cache: maven
            
        -   name: Verify Java        
            run: |
                java -version    
                echo "JAVA_HOME: $JAVA_HOME"

        -   name: Build the Project
            run: mvn package -DskipTests        
