name: 11-2-Multi-Dimension-Matrix
on:
    workflow_dispatch:
jobs:
    Test:
        strategy:
            fail-fast: false
            matrix:
                java-version: ['17', '21']
                os: ['ubuntu-latest', 'windows-latest']
                exclude:
                    - java-version: '17'
                      os: windows-latest
                include:
                    - java-version: '21'
                      os: ubuntu-latest
                      is-primary: true      
        name: Test - Java ${{matrix.java-version}}  on ${{matrix.os}}
        runs-on: ${{matrix.os}}      
        steps:
        - name: Checkout code
          uses: actions/checkout@v3
        - name: Setup Java ${{matrix.java-version}}
          uses: actions/setup-java@v4  
          with: 
            java-version: ${{matrix.java-version}}
            distribution: temurin
            cache: maven
        - run: mvn test 
          name: Running maven tests
        - name: Primary Combinationm Maker
          if: matrix.is-primary == true
          run: |
            echo "This is the primary test combo"   
            echo "java ${{matrix.java-version}} on ${{matrix.os}}"
        - name: Print Matrix Combination
          run: |
            echo "Java-version: ${{matrix.java-version}}"
            echo "OS          : ${{matrix.os}}"
            echo "Runner OS   : ${{runner.os}}"
