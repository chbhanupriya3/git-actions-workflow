# with approval gate on production
# Environments:
#   development -> no protection
#   staging     -> no protection
#   production  -> requiere reviewers: your github username 
#                   deployment branches: main only
# Finally i should be able to have summary
# development url :
# stagin url:
# production url:
# Docker build.
# image tag: commit sha value , in that only 7 characters should be printing  
# docker push   
# ===============================================

name: Build, Test, Push Docker Image
on:
    push:
        branches:
        - master
        paths:
        - 'src/**'
        - 'pom.xml'
        - 'Dockerfile' 
    workflow_dispatch:    
env:
    DOCKER_IMAGE_NAME: 'chbhanupriya3/i27-devops-dashboard'        

jobs:
    ##--------------------------Build and package ------------------------
    build:
        name: build test and package
        runs-on: ubuntu-latest
        outputs:
            iamge tag: ${{steps.tag.outputs.value}}
        steps:
        - name: Checkout Code
          uses: actions/checkout@v3
        - name: Setup Java
          uses: actions/setup-java@v3  
          with:
            java-version: '21'
            distribution: temurin
            cache: maven
        - name: Build Test and package      
          run: mvn clean package
        - name: Upload Build Artifact
          uses: actions/upload-artifact@v4  
          with:
            name: build-artifact
            path: tartget/*.jar
            retention-days: 7
        - name: Docker Image tag
          id: tag
          run: |
            echo "=======================Creating Docker Image Tag======================"    
            echo "value=${{github.sha}}" >> $GITHUB_OUTPUT
    ##---------------------------Docker Build and Push ----------------------------      
    docker-build-push:
        name: docker build and push
        runs-on: ubuntu-latest
        needs: build
        steps:
        - name: Checkout Code
          uses: actions/checkout@v3   
        - name: Login to Docker Hub
          uses: docker/login-action@v4
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}   
            password: ${{ secrets.DOCKERHUB_TOKEN }}
        - name: List the files and path
          run: |
            echo "Current path is "
            pwd
            echo "List the files in the current path"
            ls -la             
        - name: Build docker image
          run: |
            docker build \
                -t ${{ env.DOCKER_IMAGE_NAME}}:${{needs.build.outputs.image-tag}} .
        - name: Push Docker Image
          run: |
            docker push \
                ${{ env.DOCKER_IMAGE_NAME}}:${{needs.build.outputs.image-tag}}
        - name: Docker Image Details
          run: |
            echo "======================= Docker Image Details ======================"
            echo "Docker Image pushed successfully"
            echo "==================================================================="
            echo "Repository is     : ${{ env.DOCKER_IMAGE_NAME}} "
            echo "Tag is            : ${{needs.build.outputs.image-tag}} "
            echo "Full Image is     : ${{ env.DOCKER_IMAGE_NAME}}:${{needs.build.outputs.image-tag}} "
            echo "==================================================================="




